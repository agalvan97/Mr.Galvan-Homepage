<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 1 Practice Quiz — Economics</title>
<style>
    :root {
        --navy: #14532d;
        --red: #8b2432;
        --gold: #c4952e;
        --paper: #faf9f6;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --line: #d8d4cc;
        --green-ok: #1f7a44;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: Georgia, 'Times New Roman', serif;
        background: var(--paper);
        color: var(--ink);
        display: flex;
        justify-content: center;
        padding: 2rem 1rem 3rem;
    }
    .wrap { width: 100%; max-width: 680px; }
    .home-bar { text-align: center; margin-bottom: 1.2rem; }
    .home-bar a { color: var(--navy); font-size: 0.85rem; text-decoration: none; }
    .home-bar a:hover { text-decoration: underline; }

    h1 {
        font-size: 1.6rem;
        color: var(--navy);
        text-align: center;
        margin-bottom: 0.3rem;
    }
    .byline {
        text-align: center;
        color: var(--muted);
        font-style: italic;
        font-size: 0.92rem;
        margin-bottom: 1.6rem;
    }

    .progress-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        font-size: 0.85rem;
        color: var(--muted);
    }
    .progress-bar {
        flex: 1;
        height: 8px;
        background: #eee;
        border-radius: 4px;
        margin: 0 1rem;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        background: var(--gold);
        width: 0%;
        transition: width 0.3s;
    }
    .score-tag {
        font-weight: bold;
        color: var(--navy);
        white-space: nowrap;
    }

    .quiz-card {
        background: #fff;
        border: 1px solid var(--line);
        border-left: 5px solid var(--gold);
        border-radius: 6px;
        padding: 1.6rem 1.6rem 1.8rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .q-num {
        font-size: 0.75rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.5rem;
    }
    .q-prompt {
        font-size: 1.15rem;
        font-weight: bold;
        color: var(--ink);
        margin-bottom: 1.2rem;
        line-height: 1.4;
    }
    .option {
        display: block;
        width: 100%;
        text-align: left;
        font-family: Georgia, serif;
        font-size: 0.98rem;
        background: #f8f7f3;
        border: 1.5px solid var(--line);
        border-radius: 5px;
        padding: 0.7rem 0.9rem;
        margin-bottom: 0.6rem;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
    }
    .option:hover:not(.locked) {
        background: #f0ede2;
        border-color: var(--gold);
    }
    .option.correct {
        background: #e6f4ea;
        border-color: var(--green-ok);
        color: #14532d;
        font-weight: bold;
    }
    .option.incorrect {
        background: #fbeaea;
        border-color: var(--red);
        color: var(--red);
        font-weight: bold;
    }
    .option.locked { cursor: default; }

    .feedback {
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 5px;
        font-size: 0.92rem;
        line-height: 1.5;
        display: none;
    }
    .feedback.show { display: block; }
    .feedback.wrong-fb { background: #fbeaea; border-left: 4px solid var(--red); }
    .feedback.right-fb { background: #e6f4ea; border-left: 4px solid var(--green-ok); }
    .feedback .verdict { font-weight: bold; margin-bottom: 0.3rem; }
    .feedback.wrong-fb .verdict { color: var(--red); }
    .feedback.right-fb .verdict { color: var(--green-ok); }

    .next-btn {
        display: none;
        margin-top: 1.3rem;
        font-family: Georgia, serif;
        font-size: 0.95rem;
        background: var(--navy);
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 0.65rem 1.4rem;
        cursor: pointer;
        float: right;
    }
    .next-btn.show { display: inline-block; }
    .next-btn:hover { background: #0e3d21; }

    .result-card {
        display: none;
        text-align: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2.5rem 1.5rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .result-card.show { display: block; }
    .result-card h2 { color: var(--navy); font-size: 1.8rem; margin-bottom: 0.6rem; }
    .result-card .result-score { font-size: 2.6rem; font-weight: bold; color: var(--gold); margin: 0.6rem 0; }
    .result-card p { color: var(--muted); margin-bottom: 1.6rem; }
    .retry-btn {
        font-family: Georgia, serif;
        font-size: 0.95rem;
        background: var(--gold);
        color: #3a2c00;
        border: none;
        border-radius: 5px;
        padding: 0.7rem 1.6rem;
        cursor: pointer;
        font-weight: bold;
    }
    .retry-btn:hover { background: #b58a26; }

    .review-list {
        text-align: left;
        margin-top: 2rem;
        border-top: 1px solid var(--line);
        padding-top: 1.6rem;
    }
    .review-item {
        background: #f8f7f3;
        border-left: 4px solid var(--line);
        border-radius: 4px;
        padding: 0.9rem 1.1rem;
        margin-bottom: 0.9rem;
    }
    .review-item.item-right { border-left-color: var(--green-ok); }
    .review-item.item-wrong { border-left-color: var(--red); }
    .review-q { font-weight: bold; margin-bottom: 0.4rem; font-size: 0.95rem; }
    .review-tag {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: bold;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        padding: 0.15rem 0.5rem;
        border-radius: 3px;
        margin-bottom: 0.5rem;
    }
    .review-tag.item-right { background: #e6f4ea; color: var(--green-ok); }
    .review-tag.item-wrong { background: #fbeaea; color: var(--red); }
    .review-ans { font-size: 0.88rem; margin-bottom: 0.2rem; }
    .review-ans .yours-wrong { color: var(--red); text-decoration: line-through; }
    .review-ans .correct-ans { color: var(--green-ok); font-weight: bold; }
    .review-explain { font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem; }
</style>
</head>
<body>

<div class="wrap">
    <div class="home-bar"><a href="econ.html">&larr; Back to Economics</a></div>
    <h1>Unit 1 Practice Quiz</h1>
    <div class="byline">10 questions covering Lessons 1&ndash;4</div>

    <div class="progress-row">
        <span id="qCounter">Question 1 of 10</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="score-tag" id="scoreTag">Score: 0</span>
    </div>

    <div class="quiz-card" id="quizCard">
        <div class="q-num" id="qLesson"></div>
        <div class="q-prompt" id="qPrompt"></div>
        <div id="optionsWrap"></div>
        <div class="feedback" id="feedback">
            <div class="verdict" id="verdict"></div>
            <div id="explainText"></div>
        </div>
        <button class="next-btn" id="nextBtn">Next Question &rarr;</button>
    </div>

    <div class="result-card" id="resultCard">
        <h2>Quiz Complete!</h2>
        <div class="result-score" id="finalScore"></div>
        <p id="resultMsg"></p>
        <button class="retry-btn" id="retryBtn">Try Again</button>
        <div class="review-list" id="reviewList"></div>
    </div>
</div>

<script>
(function () {
    const QUESTIONS = [
        {
            lesson: "Lesson 1",
            prompt: "Scarcity exists because:",
            options: [
                "Governments regulate too many markets",
                "Human wants are unlimited but resources are limited",
                "Some countries are poorer than others",
                "Prices are set too high for most consumers"
            ],
            correct: 1,
            explain: "Scarcity is the basic economic problem: human wants are unlimited, but the resources available to satisfy them are limited."
        },
        {
            lesson: "Lesson 1",
            prompt: "Which of the following is NOT one of the four factors of production?",
            options: ["Land", "Labor", "Currency", "Capital"],
            correct: 2,
            explain: "The four factors of production are land, labor, capital, and entrepreneurship — currency (money) is not one of them."
        },
        {
            lesson: "Lesson 1",
            prompt: "An entrepreneur's main role in the economy is to:",
            options: [
                "Set interest rates for the country",
                "Combine the other factors of production to create a good or service",
                "Regulate how much a business can charge",
                "Guarantee that a business will not fail"
            ],
            correct: 1,
            explain: "Entrepreneurs take on risk to combine land, labor, and capital in order to produce goods or services."
        },
        {
            lesson: "Lesson 1",
            prompt: "The difference between a \u201cneed\u201d and a \u201cwant\u201d is best described as:",
            options: [
                "Needs are illegal to advertise; wants are not",
                "Needs are required for survival; wants improve quality of life but aren't required",
                "Needs cost money; wants are always free",
                "There is no real difference between the two terms"
            ],
            correct: 1,
            explain: "Needs (food, water, shelter) are required for survival. Wants add comfort or enjoyment but aren't strictly necessary."
        },
        {
            lesson: "Lesson 2",
            prompt: "A rational decision-maker will choose to do something additional only when:",
            options: [
                "The marginal benefit is greater than or equal to the marginal cost",
                "The marginal cost is greater than the marginal benefit",
                "A friend recommends it",
                "It has never been tried before"
            ],
            correct: 0,
            explain: "Rational decision-making means acting only when the extra (marginal) benefit is at least as large as the extra (marginal) cost."
        },
        {
            lesson: "Lesson 2",
            prompt: "Which scenario best demonstrates cost-benefit analysis?",
            options: [
                "Buying a car because it is the only one available",
                "Choosing to study an extra hour because the expected grade improvement outweighs the lost free time",
                "Picking a restaurant at random",
                "Refusing to ever spend money on entertainment"
            ],
            correct: 1,
            explain: "This weighs an additional cost (lost free time) against an additional benefit (a better grade) before deciding — that's cost-benefit analysis in action."
        },
        {
            lesson: "Lesson 3",
            prompt: "A market economy relies mainly on:",
            options: [
                "Central planning committees",
                "Supply, demand, and the price system",
                "Fixed prices set by law",
                "Barter only, with no currency"
            ],
            correct: 1,
            explain: "Market economies let supply, demand, and the resulting prices guide most economic decisions."
        },
        {
            lesson: "Lesson 3",
            prompt: "In a traditional economy, economic decisions are guided mostly by:",
            options: [
                "Stock market trends",
                "Custom, habit, and ritual passed down over generations",
                "A written five-year economic plan",
                "Competitive bidding"
            ],
            correct: 1,
            explain: "Traditional economies rely on customs and habits handed down through generations, rather than markets or central planning."
        },
        {
            lesson: "Lesson 4",
            prompt: "A country has an absolute advantage in producing a good when it can:",
            options: [
                "Produce more of that good than another country using the same resources",
                "Produce that good at a lower opportunity cost than another country",
                "Import that good more cheaply than it can export it",
                "Tax that good at a lower rate"
            ],
            correct: 0,
            explain: "Absolute advantage is about raw output: producing more of a good from the same amount of resources than another producer can."
        },
        {
            lesson: "Lesson 4",
            prompt: "According to the theory of comparative advantage, countries gain the most from trade when each country:",
            options: [
                "Tries to produce everything it consumes domestically",
                "Specializes in the good it produces at the lowest opportunity cost, then trades",
                "Bans imports of goods it can produce domestically",
                "Produces an equal amount of every good"
            ],
            correct: 1,
            explain: "Total gains from trade are maximized when each country specializes in whatever it gives up the least to produce, then trades for the rest."
        }
    ];

    let current = 0;
    let score = 0;
    let answered = false;
    let userAnswers = [];

    const qCounter = document.getElementById('qCounter');
    const progressFill = document.getElementById('progressFill');
    const scoreTag = document.getElementById('scoreTag');
    const qLesson = document.getElementById('qLesson');
    const qPrompt = document.getElementById('qPrompt');
    const optionsWrap = document.getElementById('optionsWrap');
    const feedback = document.getElementById('feedback');
    const verdict = document.getElementById('verdict');
    const explainText = document.getElementById('explainText');
    const nextBtn = document.getElementById('nextBtn');
    const quizCard = document.getElementById('quizCard');
    const resultCard = document.getElementById('resultCard');
    const finalScore = document.getElementById('finalScore');
    const resultMsg = document.getElementById('resultMsg');
    const retryBtn = document.getElementById('retryBtn');

    function loadQuestion() {
        answered = false;
        const q = QUESTIONS[current];
        qCounter.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
        progressFill.style.width = ((current) / QUESTIONS.length * 100) + '%';
        scoreTag.textContent = `Score: ${score}`;
        qLesson.textContent = q.lesson;
        qPrompt.textContent = q.prompt;
        feedback.classList.remove('show', 'wrong-fb', 'right-fb');
        nextBtn.classList.remove('show');

        optionsWrap.innerHTML = '';
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.textContent = opt;
            btn.addEventListener('click', () => selectAnswer(i));
            optionsWrap.appendChild(btn);
        });
    }

    function selectAnswer(i) {
        if (answered) return;
        answered = true;
        const q = QUESTIONS[current];
        const opts = optionsWrap.querySelectorAll('.option');
        opts.forEach(o => o.classList.add('locked'));

        if (i === q.correct) {
            score++;
            opts[i].classList.add('correct');
            verdict.textContent = 'Correct!';
            feedback.classList.add('show', 'right-fb');
        } else {
            opts[i].classList.add('incorrect');
            opts[q.correct].classList.add('correct');
            verdict.textContent = 'Not quite.';
            feedback.classList.add('show', 'wrong-fb');
        }
        explainText.textContent = q.explain;
        scoreTag.textContent = `Score: ${score}`;
        nextBtn.classList.add('show');
        userAnswers.push({ selected: i, correct: i === q.correct });
    }

    nextBtn.addEventListener('click', () => {
        current++;
        if (current >= QUESTIONS.length) {
            showResults();
        } else {
            loadQuestion();
        }
    });

    function showResults() {
        progressFill.style.width = '100%';
        quizCard.style.display = 'none';
        resultCard.classList.add('show');
        finalScore.textContent = `${score} / ${QUESTIONS.length}`;
        let msg;
        if (score === QUESTIONS.length) msg = "Perfect score! You've got Unit 1 down cold.";
        else if (score >= QUESTIONS.length * 0.8) msg = "Great work — just a couple to review.";
        else if (score >= QUESTIONS.length * 0.6) msg = "Good effort — look back over the lessons you missed.";
        else msg = "Worth another pass through the Unit 1 slides before test day.";
        resultMsg.textContent = msg;
        renderReview();
    }

    function renderReview() {
        const list = document.getElementById('reviewList');
        list.innerHTML = '<div style="font-weight:bold; color:var(--navy); margin-bottom:1rem; font-size:1.05rem;">Review Your Answers</div>';
        QUESTIONS.forEach((q, idx) => {
            const ua = userAnswers[idx];
            const cls = ua.correct ? 'item-right' : 'item-wrong';
            const div = document.createElement('div');
            div.className = 'review-item ' + cls;
            let ansHtml = '';
            if (ua.correct) {
                ansHtml = `<div class="review-ans">Your answer: <span class="correct-ans">${q.options[ua.selected]}</span></div>`;
            } else {
                ansHtml = `<div class="review-ans">Your answer: <span class="yours-wrong">${q.options[ua.selected]}</span></div>` +
                          `<div class="review-ans">Correct answer: <span class="correct-ans">${q.options[q.correct]}</span></div>`;
            }
            div.innerHTML =
                `<span class="review-tag ${cls}">${ua.correct ? 'Correct' : 'Incorrect'}</span>` +
                `<div class="review-q">${idx + 1}. ${q.prompt}</div>` +
                ansHtml +
                `<div class="review-explain">${q.explain}</div>`;
            list.appendChild(div);
        });
    }

    retryBtn.addEventListener('click', () => {
        current = 0;
        score = 0;
        userAnswers = [];
        resultCard.classList.remove('show');
        quizCard.style.display = 'block';
        loadQuestion();
    });

    loadQuestion();
})();
</script>

</body>
</html>
