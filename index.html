<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Galvan Classpage</title>
<style>
    :root {
        --blue: #0a2f6b;
        --blue-dark: #061c42;
        --blue-bright: #3f7fe0;
        --gold: #ffc72c;
        --gold-dark: #c9a227;
        --white: #fdfdfb;
        --pink: #ff8fc7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eaf1ff 0%, #fdfdfb 40%);
        color: #16213a;
    }

    /* ── Top third: school band with running horse + sparkles ── */
    .school-band {
        background: linear-gradient(180deg, var(--blue), var(--blue-dark));
        min-height: 32vh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 2.4rem;
        border-bottom: 6px solid var(--gold);
    }
    .school-band h2 {
        color: var(--gold);
        font-size: clamp(1.3rem, 4.2vw, 2.5rem);
        letter-spacing: 3px;
        text-align: center;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.35);
        padding: 0 1rem;
    }
    .school-band .sub {
        color: #c7d2ea;
        font-size: 0.85rem;
        letter-spacing: 2px;
        margin-top: 0.6rem;
        text-transform: uppercase;
    }
    .track {
        position: absolute;
        bottom: 22%;
        left: 0;
        width: 100%;
        height: 60px;
        border-top: 2px dashed rgba(255,255,255,0.22);
    }
    .horse {
        position: absolute;
        bottom: 0;
        left: -160px;
        width: 132px;
        height: 84px;
        background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFgAAAAcCAYAAADlXHhOAAACTklEQVR4nNWZIW/CQBiGv5Lp6YllmZrokm2aIFAIHKIJ2T8YIUgEPwCBJGT8g4UEMTeBQpDqjQQEYlnIBDMT+wOdWEpvx1373d3X6/Gq5nrtPff2va/08KAAfcxGEQDAZa3tyfo8PpSj+Lg1DqX9bMiEt5Qv2qFiWP6Y1WLUjFrj0CvaWABzXqsTkAHyyViMmv/6LVfbQlJMwWsN+vvrPfp5exGeY4F5WF6V9sQKMxWv1RJxels/aHPR3FgUvNZrMAvNHmfBFiVT3hN6pGzxycDA2k4vKxNe6wnmlQZbaU+8Io0VSZW3cIMxcs3kLLG8SiVC9PSyJl++OosAAGaNOtSexW9lkShMdYEXbbBsaWTVo+5wDoNOFT6fXrFD5WZuWnssal6UwfFT1dGgUwU/6IMfJG2zRvLSOL+/0721VC7xSg02gWTlB/398XraA4AEUiUlGFEwU/PuDaYylNd62gM/6O9hWVGkl5qbmtdTARx0qsoD6AhTgzHcLvCSfmgsV1vpuZvrC8qhINzslMIhkg1eqcHhZucB0H3CLldbFLTpLwiq1FLxegB/yy02VCSMyWlpYJUGrWOuiN0l3hJAklbdG2Fh0/qq3IOViN0lXqXEiJLBLyV2YFG7qC2vzXQXeJX2IvhkmNbLvP8WcoFXO8E8rOycrB7a3MDBMOjMDaOj2E07ZqENznqKsier0jcvZTHozg0jpQR3h3NUP9mSxF6fp2QMpnOTiTRJmDpc1Oa5KYPu9aQ1GGNqUX9umjLoXp/LS850GeYpUwbV638BGwmnsd3pZJMAAAAASUVORK5CYII=);
        background-repeat: no-repeat;
        background-size: 264px 84px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        animation: run-cycle 0.4s steps(2) infinite, run-across 7s linear infinite;
    }
    @keyframes run-cycle {
        from { background-position: 0 0; }
        to   { background-position: -132px 0; }
    }
    @keyframes run-across {
        from { left: -160px; }
        to   { left: 100%; }
    }
    .sparkle {
        position: absolute;
        color: var(--gold);
        font-size: 1.1rem;
        animation: twinkle 2.4s ease-in-out infinite;
        pointer-events: none;
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }

    /* ── Hero title ── */
    .hero {
        text-align: center;
        padding: 2.6rem 1.5rem 1rem;
        position: relative;
    }
    .hero h1 {
        display: inline-block;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 900;
        font-size: clamp(2rem, 6vw, 3.6rem);
        letter-spacing: 1px;
        background: linear-gradient(180deg, #6fa3ff 0%, var(--blue) 55%, var(--blue-dark) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 1px 0 rgba(255,255,255,0.6);
        filter: drop-shadow(0 3px 0 rgba(10,47,107,0.25));
    }
    .hero .rule {
        width: 140px;
        height: 6px;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--gold), var(--pink), var(--gold));
        margin: 1rem auto 0;
    }

    /* ── Page body: main (badges) + right-third profile column ── */
    .page-body {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem 1.5rem 3rem;
        align-items: flex-start;
    }
    .main-col { flex: 2 1 480px; }
    .profile-col { flex: 1 1 260px; max-width: 320px; margin: 0 auto; }

    /* ── Spinning link icons ── */
    .links {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 3.5rem;
        flex-wrap: wrap;
        padding: 1.5rem 0.5rem 2rem;
        perspective: 900px;
    }
    .link-item { text-align: center; text-decoration: none; position: relative; }
    .icon-wrap {
        position: relative;
        width: 130px;
        height: 130px;
        margin: 0 auto 1rem;
        perspective: 700px;
    }
    .icon-spin {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: spin 4.5s linear infinite;
    }
    .icon-spin svg { width: 108px; height: 108px; }
    @keyframes spin {
        from { transform: rotateY(0deg); }
        to   { transform: rotateY(360deg); }
    }
    .link-item:hover .icon-spin,
    .link-item:focus .icon-spin { animation-play-state: paused; }
    .icon-wrap .mini-sparkle {
        position: absolute;
        font-size: 1rem;
        color: var(--pink);
        animation: twinkle 1.8s ease-in-out infinite;
    }
    .link-item span.label {
        display: block;
        font-weight: bold;
        color: var(--blue);
        font-size: 1.1rem;
        letter-spacing: 0.5px;
    }
    .link-item small {
        display: block;
        color: #777;
        font-style: italic;
        margin-top: 0.2rem;
    }

    /* ── Right-third: Mr. Galvan's profile / polaroid stack ── */
    .media-label {
        text-align: center;
        font-weight: bold;
        color: #222;
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
    }
    .polaroid {
        background: #fff;
        padding: 0.7rem 0.7rem 1rem;
        box-shadow: 0 6px 14px rgba(0,0,0,0.18);
        margin: 0 auto 2rem;
        max-width: 210px;
        position: relative;
        text-align: center;
    }
    .polaroid.tilt-l { transform: rotate(-3deg); }
    .polaroid.tilt-r { transform: rotate(2.5deg); }
    .polaroid .tape {
        position: absolute;
        top: -10px; left: 50%;
        transform: translateX(-50%) rotate(-4deg);
        width: 60px; height: 20px;
        background: rgba(255, 199, 44, 0.55);
        border: 1px solid rgba(180,140,0,0.3);
    }
    .polaroid img {
        width: 100%;
        height: 190px;
        object-fit: contain;
        background: #fafafa;
        display: block;
    }

    footer {
        text-align: center;
        color: #888;
        font-size: 0.8rem;
        padding-bottom: 2.5rem;
    }
</style>
</head>
